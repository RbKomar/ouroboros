[project]
name = "ouroboros"
version = "0.1.0"
description = "Delivery and agent metrics for a repository built by AI agents - measuring the agents that build it."
readme = "README.md"
authors = [
    { name = "RbKomar", email = "robkomar98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ouroboros = "ouroboros:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = ["spec(id): links a test to a metric id defined in docs/metrics.md"]

[tool.coverage.run]
source = ["src/ouroboros"]
branch = true
